#
# Deploy the page. Separate from the aggregate job because this is the only
# job in the whole run that holds a Pages token -- and the id-token here is
# Pages' own OIDC, unrelated to the AWS one a vendor leg uses. They never meet.
name: publish

on:
  workflow_call:

# No `permissions:` -- see the note in _leg-linux.yml. The caller grants
# pages: write and id-token: write; requesting them here as well is what made
# the first full run fail at startup, before a single job began.

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Deploys must not race: the site is replaced wholesale each time.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
