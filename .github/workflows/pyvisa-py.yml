# SPDX-License-Identifier: GPL-3.0-or-later
#
# The pyvisa-py column, against a tree you name.
#
# This workflow clones a caller-named repository at a caller-named ref and runs
# it. That is the point of it, and it is also why it has no vendor leg, no AWS
# role and no Pages token: nothing that executes third-party code should be in
# a position to hold a credential. The hazard is not fork PRs specifically --
# workflow_dispatch with a `repo` input is the same hazard from a different
# trigger -- so the rule is about the workflow, not about the event.
#
# Never pull_request_target. It runs base-repo workflow code with a writable
# token and repository secrets, against a PR's source tree, which this suite
# then installs and executes.
name: pyvisa-py

on:
  pull_request:
  workflow_dispatch:
    inputs:
      repo:
        description: owner/repo to test
        default: pyvisa/pyvisa-py
      ref:
        description: branch, tag or SHA
        default: main
  schedule:
    # Nightly against upstream main, so a regression has a date attached.
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: pyvisa-py-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    uses: ./.github/workflows/_plan.yml
    with:
      run-type: pyvisa-py

  linux:
    # Named, or the job appears in the UI as every field of the leg descriptor
    # comma-joined and truncated mid-word.
    name: ${{ matrix.leg.id }}
    needs: [plan]
    if: needs.plan.outputs.linux-legs != '[]'
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.linux-legs) }}
    uses: ./.github/workflows/_leg-linux.yml
    with:
      leg: ${{ toJSON(matrix.leg) }}
      pyvisa-py-repo: ${{ inputs.repo || 'pyvisa/pyvisa-py' }}
      pyvisa-py-ref: ${{ inputs.ref || 'main' }}


  windows:
    # Named, or the job appears in the UI as every field of the leg descriptor
    # comma-joined and truncated mid-word.
    name: ${{ matrix.leg.id }}
    needs: [plan]
    if: needs.plan.outputs.windows-legs != '[]'
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.windows-legs) }}
    uses: ./.github/workflows/_leg-windows.yml
    with:
      leg: ${{ toJSON(matrix.leg) }}
      pyvisa-py-repo: ${{ inputs.repo || 'pyvisa/pyvisa-py' }}
      pyvisa-py-ref: ${{ inputs.ref || 'main' }}

  aggregate:
    needs: [plan, linux, windows]
    # always(), so a leg that died still gets reported as a column -- but not
    # when the plan itself failed, because then there is no list of legs to
    # report against and the failure to look at is two jobs upstream.
    if: always() && needs.plan.result == 'success' 
    uses: ./.github/workflows/_aggregate.yml
    with:
      plan: ${{ needs.plan.outputs.legs }}
      title: >-
        pyvisa-py ${{ inputs.repo || 'pyvisa/pyvisa-py' }}@${{ inputs.ref || 'main' }}
      subtitle: >-
        The pyvisa-py column only. No vendor implementation ran, so a failure
        here is a failure against the spec rather than a disparity with a
        shipping library.
      # The gate is the point of this workflow: it is what a pull request
      # actually wants to know.
      gate: true
      # Pages is latest-only, and the page is the full matrix. A one-column run
      # replacing it would quietly turn "pyvisa-py against three shipping
      # implementations" into "pyvisa-py against nothing". Download the site
      # artifact from this run instead.
      pages: false
