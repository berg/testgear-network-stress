# SPDX-License-Identifier: GPL-3.0-or-later
#
# Everything: every implementation, both transports.
#
# Nightly against the latest main of pyvisa and pyvisa-py. Dispatched by hand,
# against any pyvisa-py tree -- a fork, a branch, a commit -- so a branch can be
# shown next to the vendors on the same page. Only someone with write access
# can dispatch, and the vendor credential is cleared before anything from the
# tree runs (see docs/ci.md).
name: full run

on:
  schedule:
    # Nightly. It was weekly when a run meant rebuilding three vendor images
    # and a sweep that ran every script at 200 iterations; both are cheaper
    # now, and a regression is worth finding the next morning rather than the
    # next Sunday.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: owner/repo of the pyvisa-py tree to test
        default: pyvisa/pyvisa-py
      ref:
        description: branch, tag or SHA
        default: main

permissions:
  contents: read

concurrency:
  group: full-run
  # Never cancel: a vendor run is the better part of an hour and the page is
  # its only output.
  cancel-in-progress: false

jobs:
  plan:
    uses: ./.github/workflows/_plan.yml
    with:
      run-type: full

  linux:
    # Named, or the job appears in the UI as every field of the leg descriptor
    # comma-joined and truncated mid-word.
    name: ${{ matrix.leg.id }}
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.linux-legs) }}
    uses: ./.github/workflows/_leg-linux.yml
    permissions:
      contents: read
      # For the OIDC token the vendor legs exchange for the S3 read role.
      id-token: write
    secrets: inherit
    with:
      leg: ${{ toJSON(matrix.leg) }}
      pyvisa-py-repo: ${{ inputs.repo || 'pyvisa/pyvisa-py' }}
      pyvisa-py-ref: ${{ inputs.ref || 'main' }}
      pyvisa-ref: main
      # Vendor legs enter the environment; py legs get "". The environment is
      # what a fork PR cannot reach, and its branch policy is enforced by AWS
      # through the OIDC subject rather than only by this file.
      environment: ${{ matrix.leg.vendor && 'vendor-drivers' || '' }}

  aggregate:
    needs: [plan, linux]
    # always(), so a leg that died still gets reported as a column -- but not
    # when the plan itself failed, because then there is no list of legs to
    # report against and the failure to look at is two jobs upstream.
    if: always() && needs.plan.result == 'success'
    uses: ./.github/workflows/_aggregate.yml
    with:
      plan: ${{ needs.plan.outputs.legs }}
      title: >-
        VISA Conformance Matrix${{ ((inputs.repo || 'pyvisa/pyvisa-py') != 'pyvisa/pyvisa-py' || (inputs.ref || 'main') != 'main') && format(' -- pyvisa-py {0}@{1}', inputs.repo || 'pyvisa/pyvisa-py', inputs.ref || 'main') || '' }}
      subtitle: >-
        Every implementation, both transports, against pyvisa main and
        pyvisa-py ${{ inputs.repo || 'pyvisa/pyvisa-py' }}@${{ inputs.ref || 'main' }}.
      # Pages holds one page, the nightly's. A run against any other tree
      # leaves its own conformance-matrix.html instead of replacing it, and
      # does not link the Pages URL as though it were this run's page.
      page-url: >-
        ${{ (inputs.repo || 'pyvisa/pyvisa-py') == 'pyvisa/pyvisa-py' && (inputs.ref || 'main') == 'main' && 'https://berg.github.io/testgear-network-stress/' || '' }}
      pages: ${{ (inputs.repo || 'pyvisa/pyvisa-py') == 'pyvisa/pyvisa-py' && (inputs.ref || 'main') == 'main' }}

  publish:
    needs: [aggregate]
    if: >-
      always() && needs.aggregate.result != 'skipped'
      && (inputs.repo || 'pyvisa/pyvisa-py') == 'pyvisa/pyvisa-py'
      && (inputs.ref || 'main') == 'main'
    permissions:
      contents: read
      # Pages' own deploy token, unrelated to the AWS one above.
      pages: write
      id-token: write
    uses: ./.github/workflows/_publish.yml
