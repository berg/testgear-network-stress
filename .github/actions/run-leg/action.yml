#
# Run the suite for one leg and leave behind a column per transport plus a
# leg.json saying what happened -- including when nothing did.
name: Run one leg
description: Run both transports for one backend and collect its columns

inputs:
  leg:
    description: The leg descriptor, as JSON
    required: true
  out:
    description: Where to write the reports
    default: out
  pyvisa-py:
    description: Path to the pyvisa-py checkout under test
    required: true
  python:
    description: Interpreter to run the checks with
    default: python

runs:
  using: composite
  steps:
    - name: Run both transports
      id: run
      shell: bash
      env:
        LEG: ${{ inputs.leg }}
        OUT: ${{ inputs.out }}
        TESTGEAR_PYVISA_PY: ${{ inputs.pyvisa-py }}
      run: |
        set -uo pipefail
        backend=$(python -c "import json,os;print(json.loads(os.environ['LEG'])['backend'])")
        mkdir -p "$OUT"
        started=$SECONDS

        # Both transports, one after the other. compare.py always exits 0 --
        # disagreement is the finding, not an error -- so the verdict comes
        # from the exit-code sidecars, never from here.
        for proto in hislip vxi11; do
          echo "::group::$backend [$proto]"
          "${{ inputs.python }}" compare.py \
            --backends "$backend" \
            --protocol "$proto" \
            --pyvisa-py "${{ inputs.pyvisa-py }}" \
            --json "$OUT/$proto.json" \
            --exit-codes "$OUT/$proto.rc.json" || true
          echo "::endgroup::"
        done
        echo "duration=$((SECONDS - started))" >> "$GITHUB_OUTPUT"

    # Always. A leg that died before it produced anything is the case most
    # likely to go unnoticed, and the aggregate learns about it from here
    # rather than by noticing an absence.
    - name: Record what the leg did
      if: always()
      shell: bash
      env:
        LEG: ${{ inputs.leg }}
      run: |
        python tools/leg_status.py \
          --leg "$LEG" \
          --dir "${{ inputs.out }}" \
          --out "${{ inputs.out }}/leg.json" \
          --duration "${{ steps.run.outputs.duration || 0 }}" \
          --summary "$GITHUB_STEP_SUMMARY"

    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reports-${{ fromJSON(inputs.leg).id }}
        path: ${{ inputs.out }}/
        if-no-files-found: warn
        retention-days: 14
